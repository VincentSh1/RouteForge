name: Go CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted_files="$(gofmt -l .)"
          if [ -n "$unformatted_files" ]; then
            echo "The following Go files are not gofmt-clean:"
            printf '%s\n' "$unformatted_files"
            exit 1
          fi

      - name: Check module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 ./...

      - name: Test with race detector
        run: go test -race -count=1 ./...

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'

      - name: Check console
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Check offline benchmark reproducibility
        run: |
          for state in cold warm; do
            first="$(go run ./cmd/routeforge-bench -scenario all -state "$state" -pretty=false)"
            second="$(go run ./cmd/routeforge-bench -scenario all -state "$state" -pretty=false)"
            test "$first" = "$second"
          done

      - name: Check whitespace
        run: git diff --check

      - name: Check clean working tree
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Checks changed the working tree:"
            git status --short
            exit 1
          fi
