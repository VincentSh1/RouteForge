name: Compose observability smoke

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Generate disposable local admin secret
        id: admin_secret
        run: |
          test ! -e .env
          umask 077
          printf 'ROUTEFORGE_ADMIN_SECRET=%s\n' "$(openssl rand -hex 32)" > .env
          echo 'created=true' >> "$GITHUB_OUTPUT"

      - name: Validate Docker and Compose
        run: |
          docker version
          docker compose version
          docker compose config --quiet

      - name: Build RouteForge image
        run: docker compose build

      - name: Verify clean PostgreSQL state
        run: |
          docker compose up -d postgres
          for attempt in $(seq 1 60); do
            if docker compose exec -T postgres pg_isready -U routeforge_local -d routeforge >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "PostgreSQL did not become ready" >&2
              exit 1
            fi
            sleep 2
          done
          table_count="$(docker compose exec -T postgres \
            psql -U routeforge_local -d routeforge -Atqc \
            "SELECT count(*) FROM pg_tables WHERE schemaname = 'public' AND tablename LIKE 'routeforge_%';")"
          test "$table_count" -eq 0

      - name: Start RouteForge observability stack
        run: |
          docker compose up -d
          docker compose ps

      - name: Verify stack end to end
        run: |
          export ROUTEFORGE_ADMIN_SECRET="$(sed -n 's/^ROUTEFORGE_ADMIN_SECRET=//p' .env)"
          ./scripts/verify-observability-stack.sh 24

      - name: Verify transactional persistence
        run: ./scripts/verify-persistence.sh

      - name: Collect failure diagnostics
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=200 redis postgres routeforge prometheus grafana
          docker compose logs --no-color --tail=100 console

      - name: Tear down observability stack
        if: always()
        run: |
          if [ "${{ steps.admin_secret.outputs.created }}" = true ]; then
            trap 'rm -f .env' EXIT
          fi
          docker compose down -v --remove-orphans
