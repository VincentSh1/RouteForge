worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server {
        listen 8080;
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        location = /health { default_type text/plain; return 200 "ok\n"; }
        location ~ "^/api/requests(?:/rfreq_[A-Za-z0-9_-]{22})?$" {
            set $upstream routeforge:8081;
            rewrite ^/api/(.*)$ /admin/v1/$1 break;
            proxy_pass http://$upstream;
            proxy_pass_request_headers off;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host routeforge;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            proxy_buffering off;
        }
        location /api/ { return 404; }
        location /assets/ { try_files $uri =404; }
        location / { try_files $uri /index.html; }
    }
}
